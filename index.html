<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learning Playground — DSA & System Design</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231f1b16'/><text x='16' y='22' font-family='monospace' font-size='16' fill='%23f4ebe0' text-anchor='middle'>lp</text></svg>" />
    <script>
      // Apply persisted theme before paint to avoid a flash.
      try {
        var t = JSON.parse(localStorage.getItem('lp:app:theme') || 'null');
        var mode = t && t.state && t.state.theme;
        if (mode === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
